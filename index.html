<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <!-- Quan trọng cho điện thoại -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>10A4</title>

    <style>

        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #000;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
        }


        /* =========================
           BACKGROUND
        ========================= */

        .background {
            position: fixed;
            inset: 0;

            background:
                radial-gradient(
                    circle at 50% 45%,
                    rgba(255,255,255,0.09),
                    transparent 32%
                ),
                #000;

            z-index: -2;
        }


        /* =========================
           GRID
        ========================= */

        .grid {
            position: fixed;

            width: 200%;
            height: 200%;

            left: -50%;
            top: -20%;

            background-image:
                linear-gradient(
                    rgba(255,255,255,0.035) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.035) 1px,
                    transparent 1px
                );

            background-size: 50px 50px;

            transform:
                perspective(500px)
                rotateX(60deg);

            animation: gridMove 12s linear infinite;

            z-index: -1;
        }

        @keyframes gridMove {

            from {
                transform:
                    perspective(500px)
                    rotateX(60deg)
                    translateY(0);
            }

            to {
                transform:
                    perspective(500px)
                    rotateX(60deg)
                    translateY(50px);
            }
        }


        /* =========================
           MAIN
        ========================= */

        .container {
            width: 100%;
            height: 100svh;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;

            padding:
                24px
                20px
                70px;
        }

        .content {
            width: 100%;
            max-width: 900px;

            animation: appear 1.2s ease forwards;
        }

        @keyframes appear {

            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        /* =========================
           SMALL TEXT
        ========================= */

        .small-text {

            font-size: clamp(11px, 2.8vw, 14px);

            letter-spacing: clamp(3px, 1.2vw, 6px);

            color: #777;

            margin-bottom: 16px;

            text-transform: uppercase;
        }


        /* =========================
           MAIN TITLE
        ========================= */

        h1 {

            font-size:
                clamp(58px, 18vw, 140px);

            line-height: 0.95;

            font-weight: 800;

            letter-spacing:
                clamp(4px, 1.5vw, 10px);

            color: #fff;

            text-shadow:
                0 0 10px rgba(255,255,255,0.3),
                0 0 35px rgba(255,255,255,0.12);

            transition:
                transform 0.3s ease,
                text-shadow 0.3s ease;
        }

        h1:hover {

            transform: scale(1.04);

            text-shadow:
                0 0 15px rgba(255,255,255,0.7),
                0 0 45px rgba(255,255,255,0.3);
        }


        /* =========================
           SLOGAN
        ========================= */

        .slogan {

            margin-top: 20px;

            font-size:
                clamp(17px, 5vw, 28px);

            line-height: 1.4;

            letter-spacing:
                clamp(1px, 0.8vw, 4px);

            color: #aaa;

            opacity: 0;

            animation:
                fadeIn 1s ease forwards;

            animation-delay: 0.5s;
        }

        @keyframes fadeIn {

            to {
                opacity: 1;
            }
        }


        /* =========================
           LINE
        ========================= */

        .line {

            width: 0;

            height: 1px;

            background: rgba(255,255,255,0.7);

            margin:
                25px auto 0;

            animation:
                lineGrow 1s ease forwards;

            animation-delay: 1s;
        }

        @keyframes lineGrow {

            to {
                width: min(180px, 45vw);
            }
        }


        /* =========================
           FOOTER
        ========================= */

        .footer {

            position: fixed;

            left: 0;
            bottom: 0;

            width: 100%;

            text-align: center;

            padding:
                16px
                20px
                max(16px, env(safe-area-inset-bottom));

            color: #444;

            font-size: 10px;

            letter-spacing: 2px;
        }


        /* =========================
           PHONE
        ========================= */

        @media (max-width: 600px) {

            .grid {

                background-size:
                    32px 32px;

                opacity: 0.8;
            }

            .background {

                background:
                    radial-gradient(
                        circle at 50% 45%,
                        rgba(255,255,255,0.07),
                        transparent 38%
                    ),
                    #000;
            }

            .container {

                padding:
                    20px
                    18px
                    75px;
            }

            .small-text {

                margin-bottom: 14px;
            }

            .slogan {

                margin-top: 18px;
            }

            .line {

                margin-top: 22px;
            }
        }


        /* =========================
           VERY SMALL PHONES
        ========================= */

        @media (max-width: 360px) {

            h1 {
                font-size: 56px;
            }

            .slogan {
                font-size: 16px;
            }

            .small-text {
                font-size: 10px;
            }
        }

    </style>
</head>


<body>


    <!-- Background -->
    <div class="background"></div>

    <div class="grid"></div>


    <!-- Main content -->
    <main class="container">

        <div class="content">

            <div class="small-text">
                Welcome to
            </div>

            <h1>
                10A4
            </h1>

            <div class="slogan">
                gặp là phải trốn
            </div>

            <div class="line"></div>

        </div>

    </main>


    <!-- Footer -->
    <div class="footer">
        EST. 2026 • 10A4
    </div>


</body>
</html>
```
